# Strapi — build the Strapi CMS image and deploy to lily via the shared reusable
# workflow (TheDevs-cz/ci). Replaces the old build + appleboy/ssh-action deploy to
# spare.srv (whose deploy-strapi.sh ran `npm run build` on the host — the admin
# build is now baked into the image).
#
# `target: prod` — strapi/Dockerfile is multi-stage (`dev`, then `prod`).
#
# ONE HOOK, TWO WORKFLOWS: see frontend-release.yml (`app: masfb`, tag `main`).

name: Strapi

on:
    push:
        branches:
            - main
        paths:
            - 'strapi/**'
            - '.github/workflows/strapi.yml'

permissions:
    contents: read
    packages: write

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            # Passed EXPLICITLY: `secrets: inherit` cannot cross repo owners.
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: masfb                                              # hook id == /srv/<app> == compose project
            image: ghcr.io/janmikes/mas-frydlantsko-beskydy-strapi  # image name != app -> explicit
            context: ./strapi
            target: prod
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
